version: '3.9'

services:
  postgres:
    image: pgvector/pgvector:pg18-trixie
    environment:
      POSTGRES_DB: brain
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Init script: creates the `pii` database on first startup.
      # Script is idempotent via DO $$ ... EXCEPTION ... END $$.
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d brain && pg_isready -U postgres -d pii"]
      interval: 10s
      timeout: 5s

  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      # Single source of truth for configuration.
      # The .env file already comes with docker-aware defaults (DB_HOST=postgres,
      # the docker-compose service name). Users only override if running the API
      # OUTSIDE docker (e.g., `uv run uvicorn` on the host machine) — in that
      # case, they edit .env and change DB_HOST to "localhost". No `environment:`
      # override here because that would be redundant.
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./vault-mirror:/app/vault-mirror
      - ./backups:/app/backups

volumes:
  postgres_data:
