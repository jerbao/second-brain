[project]
name = "universal-brain"
version = "0.1.0"
description = "Autonomous memory server — PostgreSQL 18 + pgvector + FastAPI/MCP"
requires-python = ">=3.14"

[project.dependencies]
# Database
asyncpg = ">=0.30"
pgvector = ">=0.3.0"

# Web
fastapi = ">=0.115.0"
uvicorn = { extras = ["standard"], version = ">=0.32.0" }

# HTTP client (LLM calls)
httpx = ">=0.28.0"

# Validation
pydantic = ">=2.10.0"
pydantic-settings = ">=2.0.0"

# Security
cryptography = ">=44.0.0"

# Utilities
pyyaml = ">=6.0"
schedule = ">=1.2.0"

[project.optional-dependencies]
dev = [
    "ruff>=0.9.0",
    "basedpyright>=1.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.basedpyright]
include = ["src/**/*.py", "mcp_server/**/*.py", "supervisor/**/*.py", "librarian/**/*.py"]
exclude = ["**/__pycache__"]
typeCheckingMode = "strict"
reportMissingImports = true
reportMissingTypeStubs = false
